<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex — Explore the World of Pokémon</title>
  <meta name="description" content="Browse and search all Pokémon with stats, types, and abilities. A beautiful modern Pokédex powered by PokéAPI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0c10;
      --surface: #13141a;
      --surface2: #1c1e27;
      --border: rgba(255,255,255,0.07);
      --accent: #ffcc02;
      --accent2: #e63946;
      --text: #f0f0f0;
      --muted: #7a7f99;
      --radius: 16px;

      /* type colours */
      --fire:#ff6b35; --water:#4fc3f7; --grass:#66bb6a; --electric:#ffee58;
      --psychic:#f48fb1; --ice:#80deea; --dragon:#7e57c2; --dark:#616161;
      --fairy:#f48fb1; --normal:#bdbdbd; --fighting:#ef5350; --flying:#81d4fa;
      --poison:#ab47bc; --ground:#ffa726; --rock:#8d6e63; --bug:#aed581;
      --ghost:#5c6bc0; --steel:#90a4ae;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11,12,16,0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .header-inner {
      max-width: 1200px; margin: auto;
      display: flex; align-items: center; gap: 20px;
      height: 70px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px;
      text-decoration: none; color: var(--text);
    }
    .logo .pokeball {
      width: 34px; height: 34px;
      background: conic-gradient(var(--accent2) 180deg, white 180deg);
      border-radius: 50%;
      border: 3px solid white;
      position: relative;
      box-shadow: 0 0 18px rgba(230,57,70,0.5);
    }
    .logo .pokeball::after {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      background: white; border-radius: 50%;
      border: 2px solid #333;
    }
    .logo span { color: var(--accent); }

    #search-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 10px 20px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,204,2,0.15);
    }
    #search-input::placeholder { color: var(--muted); }

    .filter-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .type-btn {
      padding: 6px 14px; border-radius: 50px;
      border: 1.5px solid var(--border);
      background: transparent; color: var(--muted);
      font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: all 0.2s;
    }
    .type-btn:hover, .type-btn.active {
      color: #000; border-color: transparent;
    }

    /* ── HERO ── */
    .hero {
      text-align: center; padding: 64px 24px 40px;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,204,2,0.08) 0%, transparent 70%);
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800; letter-spacing: -1px;
      line-height: 1.1;
    }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted); margin-top: 12px; font-size: 1.05rem; }
    .hero .stats-row {
      display: flex; justify-content: center; gap: 32px; margin-top: 28px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 50px; padding: 8px 20px;
      font-size: 0.9rem; font-weight: 600;
    }
    .stat-pill span { color: var(--accent); }

    /* ── FILTER SECTION ── */
    .controls {
      max-width: 1200px; margin: 0 auto; padding: 0 24px 24px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .controls label { color: var(--muted); font-size: 0.85rem; }

    /* ── GRID ── */
    main { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }

    #pokemon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px 16px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04), transparent 70%);
      opacity: 0; transition: opacity 0.3s;
    }
    .card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,0.15); }
    .card:hover::before { opacity: 1; }
    .card:hover { box-shadow: 0 16px 40px rgba(0,0,0,0.5); }

    .card-num { color: var(--muted); font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; }
    .card-img-wrap {
      width: 110px; height: 110px; margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .card-img-wrap img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
      transition: transform 0.3s;
    }
    .card:hover .card-img-wrap img { transform: scale(1.12) translateY(-4px); }
    .card-name {
      font-weight: 700; font-size: 1rem;
      text-transform: capitalize; margin-bottom: 8px;
    }
    .card-types { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .type-tag {
      padding: 3px 10px; border-radius: 50px;
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: #000;
    }

    /* ── LOADING / EMPTY ── */
    .loader {
      grid-column: 1/-1; text-align: center; padding: 60px 0;
      color: var(--muted);
    }
    .spinner {
      width: 48px; height: 48px; margin: 0 auto 16px;
      border: 4px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #load-more-btn {
      display: block; margin: 32px auto 0;
      background: linear-gradient(135deg, var(--accent), #ffaa00);
      color: #000; border: none; border-radius: 50px;
      padding: 14px 40px; font-size: 1rem; font-weight: 700;
      font-family: 'Outfit', sans-serif; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(255,204,2,0.3);
    }
    #load-more-btn:hover { transform: scale(1.04); box-shadow: 0 8px 28px rgba(255,204,2,0.45); }
    #load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── MODAL ── */
    #modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #modal-overlay.open { opacity: 1; pointer-events: all; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 560px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      padding: 32px;
      transform: scale(0.92) translateY(20px);
      transition: transform 0.3s;
      position: relative;
    }
    #modal-overlay.open #modal { transform: scale(1) translateY(0); }

    #modal-close {
      position: absolute; top: 16px; right: 16px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, background 0.2s;
    }
    #modal-close:hover { color: var(--text); background: var(--border); }

    .modal-header { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; }
    .modal-img {
      width: 120px; height: 120px; object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
      flex-shrink: 0;
    }
    .modal-title-block {}
    .modal-num { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
    .modal-name {
      font-size: 1.8rem; font-weight: 800;
      text-transform: capitalize; margin: 4px 0 8px;
    }

    .section-title {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--muted); margin-bottom: 10px;
    }
    .modal-section { margin-bottom: 20px; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .info-item {
      background: var(--surface2); border-radius: 10px; padding: 10px 14px;
    }
    .info-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .info-value { font-size: 1rem; font-weight: 700; margin-top: 2px; }

    .stat-row { margin-bottom: 8px; }
    .stat-row-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .stat-name { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .stat-val { font-size: 0.85rem; font-weight: 700; }
    .stat-bar-bg { height: 6px; background: var(--surface2); border-radius: 50px; overflow: hidden; }
    .stat-bar-fill {
      height: 100%; border-radius: 50px;
      background: linear-gradient(90deg, var(--accent), #ffaa00);
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    .abilities-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .ability-tag {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 50px; padding: 5px 14px;
      font-size: 0.8rem; font-weight: 600; text-transform: capitalize;
    }

    /* type colours applied via JS */
    .bg-fire{background:var(--fire)} .bg-water{background:var(--water)}
    .bg-grass{background:var(--grass)} .bg-electric{background:var(--electric)}
    .bg-psychic{background:var(--psychic)} .bg-ice{background:var(--ice)}
    .bg-dragon{background:var(--dragon)} .bg-dark{background:var(--dark);color:#fff}
    .bg-fairy{background:var(--fairy)} .bg-normal{background:var(--normal)}
    .bg-fighting{background:var(--fighting)} .bg-flying{background:var(--flying)}
    .bg-poison{background:var(--poison)} .bg-ground{background:var(--ground)}
    .bg-rock{background:var(--rock)} .bg-bug{background:var(--bug)}
    .bg-ghost{background:var(--ghost);color:#fff} .bg-steel{background:var(--steel)}

    /* responsive */
    @media (max-width: 600px) {
      #pokemon-grid { grid-template-columns: repeat(2, 1fr); }
      .modal-header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="pokeball"></div>
      Poké<span>Dex</span>
    </a>
    <input id="search-input" type="search" placeholder="Search Pokémon by name or #…" autocomplete="off" />
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Explore the World of <span>Pokémon</span></h1>
  <p>Search, filter, and discover all Pokémon — stats, types, and abilities at a glance.</p>
  <div class="stats-row">
    <div class="stat-pill">Total: <span id="total-count">—</span> Pokémon</div>
    <div class="stat-pill">Showing: <span id="showing-count">0</span></div>
    <div class="stat-pill">Generations: <span>I – IX</span></div>
  </div>
</section>

<!-- FILTER BAR -->
<div class="controls">
  <label>Filter by type:</label>
  <div class="filter-bar" id="type-filter-bar">
    <button class="type-btn active" data-type="all">All</button>
  </div>
</div>

<!-- GRID -->
<main>
  <div id="pokemon-grid">
    <div class="loader">
      <div class="spinner"></div>
      <p>Loading Pokédex…</p>
    </div>
  </div>
  <button id="load-more-btn" style="display:none">Load More</button>
</main>

<!-- MODAL -->
<div id="modal-overlay" role="dialog" aria-modal="true">
  <div id="modal">
    <button id="modal-close" aria-label="Close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  const API = 'https://pokeapi.co/api/v2';
  const BATCH = 40;
  const TYPES = ['fire','water','grass','electric','psychic','ice','dragon','dark',
                  'fairy','normal','fighting','flying','poison','ground','rock','bug','ghost','steel'];

  let allPokemon = [];   // full list [{name, url, id}]
  let filtered   = [];   // after search/type filter
  let rendered   = 0;
  let activeType = 'all';
  let searchQ    = '';
  let detailCache = {};

  // ── Build type filter buttons ──
  const filterBar = document.getElementById('type-filter-bar');
  TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'type-btn';
    btn.dataset.type = t;
    btn.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    btn.style.setProperty('--tc', `var(--${t})`);
    filterBar.appendChild(btn);
  });

  filterBar.addEventListener('click', e => {
    const btn = e.target.closest('.type-btn');
    if (!btn) return;
    filterBar.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeType = btn.dataset.type;
    applyFilters();
  });

  // Style active type buttons
  filterBar.querySelectorAll('.type-btn[data-type]').forEach(btn => {
    const t = btn.dataset.type;
    btn.addEventListener('mouseover', () => {
      if (t !== 'all') btn.style.background = `var(--${t})`;
    });
    btn.addEventListener('mouseout', () => {
      if (!btn.classList.contains('active')) btn.style.background = '';
    });
    btn.addEventListener('click', () => {
      filterBar.querySelectorAll('.type-btn').forEach(b => {
        b.style.background = '';
        b.style.color = '';
      });
      if (t !== 'all') { btn.style.background = `var(--${t})`; btn.style.color = '#000'; }
    });
  });

  // ── Search ──
  document.getElementById('search-input').addEventListener('input', e => {
    searchQ = e.target.value.trim().toLowerCase();
    applyFilters();
  });

  // ── Fetch all Pokémon list ──
  async function fetchAllPokemon() {
    const res = await fetch(`${API}/pokemon?limit=1500`);
    const data = await res.json();
    allPokemon = data.results.map((p, i) => {
      const id = parseInt(p.url.split('/').filter(Boolean).pop());
      return { name: p.name, url: p.url, id };
    });
    document.getElementById('total-count').textContent = allPokemon.length;
    applyFilters();
  }

  // ── Filters ──
  async function applyFilters() {
    let pool = allPokemon;

    if (searchQ) {
      pool = pool.filter(p =>
        p.name.includes(searchQ) ||
        String(p.id).includes(searchQ)
      );
    }

    if (activeType !== 'all') {
      // fetch type list (cache)
      if (!window._typeCache) window._typeCache = {};
      if (!window._typeCache[activeType]) {
        const r = await fetch(`${API}/type/${activeType}`);
        const d = await r.json();
        window._typeCache[activeType] = new Set(d.pokemon.map(p => p.pokemon.name));
      }
      pool = pool.filter(p => window._typeCache[activeType].has(p.name));
    }

    filtered = pool;
    rendered = 0;
    renderGrid(true);
  }

  // ── Render grid ──
  function renderGrid(reset = false) {
    const grid = document.getElementById('pokemon-grid');
    if (reset) grid.innerHTML = '';

    if (filtered.length === 0 && reset) {
      grid.innerHTML = `<div class="loader"><p style="font-size:1.1rem">No Pokémon found 😔</p></div>`;
      document.getElementById('load-more-btn').style.display = 'none';
      document.getElementById('showing-count').textContent = 0;
      return;
    }

    const slice = filtered.slice(rendered, rendered + BATCH);
    slice.forEach(p => {
      const card = buildCard(p);
      grid.appendChild(card);
    });
    rendered += slice.length;
    document.getElementById('showing-count').textContent = rendered;

    const btn = document.getElementById('load-more-btn');
    btn.style.display = rendered < filtered.length ? 'block' : 'none';
  }

  function buildCard(p) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = p.id;
    const img = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png`;
    card.innerHTML = `
      <div class="card-num">#${String(p.id).padStart(4,'0')}</div>
      <div class="card-img-wrap">
        <img src="${img}" alt="${p.name}" loading="lazy" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png'" />
      </div>
      <div class="card-name">${p.name}</div>
      <div class="card-types" id="types-${p.id}"><span style="color:var(--muted);font-size:0.75rem">loading…</span></div>
    `;
    card.addEventListener('click', () => openModal(p));
    // lazy-load types
    fetchTypes(p.id).then(types => {
      const el = document.getElementById(`types-${p.id}`);
      if (el) el.innerHTML = types.map(t => `<span class="type-tag bg-${t}">${t}</span>`).join('');
    });
    return card;
  }

  // ── Type cache per pokemon ──
  const typeCache = {};
  async function fetchTypes(id) {
    if (typeCache[id]) return typeCache[id];
    try {
      const d = await getDetail(id);
      const types = d.types.map(t => t.type.name);
      typeCache[id] = types;
      return types;
    } catch { return []; }
  }

  async function getDetail(id) {
    if (detailCache[id]) return detailCache[id];
    const res = await fetch(`${API}/pokemon/${id}`);
    detailCache[id] = await res.json();
    return detailCache[id];
  }

  // ── Load more ──
  document.getElementById('load-more-btn').addEventListener('click', () => renderGrid());

  // ── Modal ──
  async function openModal(p) {
    const overlay = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');
    overlay.classList.add('open');
    content.innerHTML = `<div class="loader"><div class="spinner"></div><p>Loading…</p></div>`;

    try {
      const d = await getDetail(p.id);
      const types = d.types.map(t => t.type.name);
      const img = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png`;

      const statNames = { hp:'HP', attack:'Attack', defense:'Defense',
        'special-attack':'Sp. Atk', 'special-defense':'Sp. Def', speed:'Speed' };

      content.innerHTML = `
        <div class="modal-header">
          <img class="modal-img" src="${img}" alt="${d.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png'" />
          <div class="modal-title-block">
            <div class="modal-num">#${String(p.id).padStart(4,'0')}</div>
            <div class="modal-name">${d.name}</div>
            <div class="card-types">${types.map(t=>`<span class="type-tag bg-${t}">${t}</span>`).join('')}</div>
          </div>
        </div>

        <div class="modal-section">
          <div class="section-title">Info</div>
          <div class="info-grid">
            <div class="info-item"><div class="info-label">Height</div><div class="info-value">${(d.height/10).toFixed(1)} m</div></div>
            <div class="info-item"><div class="info-label">Weight</div><div class="info-value">${(d.weight/10).toFixed(1)} kg</div></div>
            <div class="info-item"><div class="info-label">Base XP</div><div class="info-value">${d.base_experience ?? '—'}</div></div>
            <div class="info-item"><div class="info-label">Order</div><div class="info-value">${d.order}</div></div>
          </div>
        </div>

        <div class="modal-section">
          <div class="section-title">Base Stats</div>
          ${d.stats.map(s => `
            <div class="stat-row">
              <div class="stat-row-top">
                <span class="stat-name">${statNames[s.stat.name] ?? s.stat.name}</span>
                <span class="stat-val">${s.base_stat}</span>
              </div>
              <div class="stat-bar-bg">
                <div class="stat-bar-fill" style="width:0%" data-val="${Math.min(s.base_stat/255*100,100)}"></div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="modal-section">
          <div class="section-title">Abilities</div>
          <div class="abilities-list">
            ${d.abilities.map(a => `<span class="ability-tag">${a.ability.name}${a.is_hidden?' ✦':''}</span>`).join('')}
          </div>
        </div>
      `;

      // animate stat bars
      requestAnimationFrame(() => {
        document.querySelectorAll('.stat-bar-fill').forEach(bar => {
          bar.style.width = bar.dataset.val + '%';
        });
      });
    } catch (err) {
      content.innerHTML = `<p style="color:var(--muted)">Failed to load details.</p>`;
    }
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  // ── Boot ──
